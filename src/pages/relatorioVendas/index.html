<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="relatorio-vendas-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Relatório de Vendas</title>
</head>

<body>
    <div class="container">

        <!-- Mensagem de feedback -->
        <div id="feedback-message" class="feedback" style="display: none;"></div>

        <!-- Botão de Voltar -->
        <button id="menu-back" class="button-back">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <!-- Cabeçalho -->
        <header class="header">
            <h1>Relatório de Vendas</h1>
        </header>

        <!-- Filtros e Pesquisa -->
        <section class="filters-container">
            <input type="date" id="start-date" class="filter-input" placeholder="Data Inicial">
            <input type="date" id="end-date" class="filter-input" placeholder="Data Final">
            <button id="apply-filters" class="filter-button">Aplicar Filtros</button>
        </section>
        


        <!-- Tabela de Vendas -->
        <section class="sales-report">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>Data da Venda</th>
                        <th>Produto</th>
                        <th>Total da Venda</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>
                <tbody class="sales-list">
                    <!-- As vendas serão inseridas aqui -->
                </tbody>
            </table>


        </section>

    </div>

    <script src="relatorio-vendas.js"></script>
</body>

</html>
